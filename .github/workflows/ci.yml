name: CI

on:
  push:
  pull_request:

jobs:
  test:
    # 固定在 24.04：ubuntu-latest 已滚动到 26.04，而 setup-python 没有 26.04 的
    # Python 3.9 预编译包，3.9 矩阵会在装解释器这一步就失败。
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e ".[xlsx]"
      - name: Test
        run: python -m unittest discover -s tests -v
